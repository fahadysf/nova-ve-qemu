name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Self-hosted ESXi fleet — one VM per matrix leg, all versions build in
    # parallel with no minute budget. ubuntu-latest works as a fallback for a
    # one-off rebuild (just override runs-on).
    runs-on: [self-hosted, qemu-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "2.12.1"
            tier: "legacy-2.12"
          - version: "4.1.0"
            tier: "mid"
          - version: "5.2.0"
            tier: "mid"
          - version: "11.1.3"
            tier: "current"
    steps:
      - name: Clean workspace (self-hosted hygiene)
        run: sudo rm -rf ./* ./.??* || true

      - uses: actions/checkout@v4

      - name: Build deb for QEMU ${{ matrix.version }}
        run: bash build.sh "${{ matrix.version }}" "${{ matrix.tier }}"

      - name: Smoke test in ubuntu:26.04
        run: bash scripts/smoke-test.sh "dist/nova-ve-qemu-${{ matrix.version }}_1_amd64.deb" "${{ matrix.version }}"

      - name: Clean build tree (keep the runner lean)
        if: always()
        run: sudo rm -rf "build-${{ matrix.version }}" dist || true

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.version }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Create release and attach debs
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/SHA256SUMS
          generate_release_notes: true
